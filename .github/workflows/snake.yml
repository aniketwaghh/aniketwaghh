# Renders the contribution graph as a snake animation and publishes the SVGs to
# the `output` branch, which README.md points at. Light and dark variants are
# generated so the graph matches the visitor's GitHub theme.
name: Contribution snake

on:
  schedule:
    - cron: "43 2 * * *" # daily, 02:43 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

# Both a manual run and a push run committing at the same time race on
# `git push`; serialise them instead of letting the loser fail.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Generate snake
    runs-on: ubuntu-latest
    steps:
      - name: Render contribution grid
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
